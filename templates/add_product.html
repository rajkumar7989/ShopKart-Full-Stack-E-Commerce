<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopKart - Add Product</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>


<!-- ================================================= -->
<!-- ADMIN NAVBAR -->
<!-- ================================================= -->

<nav class="navbar">

    <div class="logo">
        🛒 ShopKart Admin
    </div>

    <div class="nav-links">

        <a href="/admin">
            Dashboard
        </a>

        <a href="/admin/products">
            Products
        </a>

        <a href="/admin/orders">
            Orders
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<!-- ================================================= -->
<!-- ADD PRODUCT SECTION -->
<!-- ================================================= -->

<section class="auth-section">

    <div class="auth-container">

        <h1>
            Add New Product 📦
        </h1>

        <p class="auth-subtitle">
            Enter the product details below.
        </p>


        <!-- ================================================= -->
        <!-- PRODUCT FORM -->
        <!-- ================================================= -->

        <form
            action="/admin/products/add"
            method="POST"
            enctype="multipart/form-data"
        >


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Enter product description"
                    required
                ></textarea>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label for="price">
                    Price (₹)
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    min="0"
                    placeholder="Enter price"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Home & Kitchen">
                        Home & Kitchen
                    </option>

                    <option value="Beauty">
                        Beauty
                    </option>

                </select>

            </div>


            <!-- STOCK -->

            <div class="form-group">

                <label for="stock">
                    Stock
                </label>

                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    placeholder="Enter stock quantity"
                    required
                >

            </div>


            <!-- ================================================= -->
            <!-- IMAGE UPLOAD -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="image">
                    Product Image
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept=".jpg,.jpeg,.png,.webp"
                    required
                >

                <small>
                    Supported formats:
                    JPG, JPEG, PNG, WEBP
                </small>

            </div>


            <!-- ================================================= -->
            <!-- IMAGE PREVIEW -->
            <!-- ================================================= -->

            <div
                id="image-preview-container"
                style="
                    display: none;
                    margin-top: 15px;
                    margin-bottom: 20px;
                "
            >

                <p>
                    Image Preview:
                </p>

                <img
                    id="image-preview"
                    src=""
                    alt="Product Preview"
                    style="
                        width: 200px;
                        height: 200px;
                        object-fit: contain;
                        border: 1px solid #ddd;
                        border-radius: 8px;
                        padding: 5px;
                        background: #f5f5f5;
                    "
                >

            </div>


            <!-- ================================================= -->
            <!-- BUTTONS -->
            <!-- ================================================= -->

            <div
                style="
                    display: flex;
                    gap: 10px;
                    margin-top: 20px;
                "
            >

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Add Product
                </button>


                <a
                    href="/admin/products"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>

</section>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<footer>

    <p>
        © 2026 ShopKart Admin. All Rights Reserved.
    </p>

</footer>


<!-- ================================================= -->
<!-- IMAGE PREVIEW JAVASCRIPT -->
<!-- ================================================= -->

<script>

    const imageInput =
        document.getElementById("image");


    const previewContainer =
        document.getElementById(
            "image-preview-container"
        );


    const previewImage =
        document.getElementById(
            "image-preview"
        );


    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];


            if (!file) {

                previewContainer.style.display =
                    "none";

                previewImage.src = "";

                return;

            }


            const allowedTypes = [

                "image/jpeg",
                "image/jpg",
                "image/png",
                "image/webp"

            ];


            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                alert(
                    "Please select a JPG, JPEG, PNG or WEBP image."
                );

                this.value = "";

                previewContainer.style.display =
                    "none";

                return;

            }


            const imageURL =
                URL.createObjectURL(
                    file
                );


            previewImage.src =
                imageURL;


            previewContainer.style.display =
                "block";

        }
    );

</script>


</body>

</html>
