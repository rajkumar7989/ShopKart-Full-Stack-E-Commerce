<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopKart - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


    <nav class="navbar">

        <div class="logo">
            🛒 ShopKart
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/login">
                Login
            </a>

        </div>

    </nav>


    <section class="auth-section">

        <div class="auth-container">

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Create your ShopKart account
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="/register"
            >


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Register
                </button>


            </form>


            <p class="auth-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 ShopKart. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
